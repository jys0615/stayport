# 테스트 전용 override. 테스트가 ./data 를 만들지 않아야 하고,
# 기동 시 동기화가 공급사를 부르는 것도 테스트가 직접 통제한다.
spring:
  datasource:
    url: jdbc:h2:mem:stayport-test;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop

stayport:
  sync:
    on-startup: false
  circuit-breaker:
    # 다른 테스트들은 "한쪽이 실패해도 나머지로 응답한다"를 보는 것이라, 반복 실패로 서킷이
    # 열리면 그 주장이 아니라 서킷을 보게 된다. 기본은 열리지 않게 두고 서킷 테스트만 낮춰 쓴다.
    minimum-calls: 1000
