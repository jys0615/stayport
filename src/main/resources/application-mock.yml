# 공급사 흉내 서버 전용 프로파일.
#
# 본 앱과 포트를 나눠야 통합 테스트에서 실패 원인을 앱 문제로 오해하지 않는다.
# 같은 이유로 데이터소스도 나눈다 — 가짜 공급사가 우리 매핑 DB를 붙잡고 있으면
# 앱을 지웠다 띄우는 검증이 조용히 무효가 된다. (실제로 한 번 속았다)
server:
  port: 9090

spring:
  datasource:
    url: jdbc:h2:mem:mock-supplier
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never

stayport:
  sync:
    on-startup: false
