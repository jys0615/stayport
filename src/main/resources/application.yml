spring:
  application:
    name: stayport
  datasource:
    url: jdbc:h2:file:./data/stayport;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080
  tomcat:
    mbeanregistry:
      # tomcat.threads.* 지표 노출용 — 부하 측정에서 본 "스레드 인질"을 지표로 확인하는 데 필요
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # 운영 노출 전제가 아니다 — /internal과 같은 층위의 확인용. 해석은 docs/monitoring.md
        include: health,metrics

stayport:
  search:
    # 검색 한 건의 전체 예산. 공급사 호출(3s)은 병렬이므로 여기에 병합·직렬화 여유 0.5s를 더했다.
    total-budget: 3500ms
  sync:
    on-startup: true
  circuit-breaker:
    # 최근 10건 중 절반이 실패하면 10초간 부르지 않는다. 최소 5건은 봐야 판정한다 —
    # 검색 한 건이 공급사를 한두 번 부르므로 이 창은 몇 번의 검색에 해당한다. 근거: design.md §10
    sliding-window-size: 10
    minimum-calls: 5
    failure-rate-threshold: 50
    wait-duration-in-open-state: 10s
    permitted-calls-in-half-open-state: 2
  suppliers:
    a:
      base-url: ${SUPPLIER_A_BASE_URL:http://localhost:9090}
      api-key: ${SUPPLIER_A_API_KEY:local-dev-key-a}
      chunk-size: 50
      connect-timeout: 1s
      call-timeout: 3s
      paths:
        catalog: /a/v1/hotels
        availability: /a/v1/availability
    b:
      base-url: ${SUPPLIER_B_BASE_URL:http://localhost:9090}
      api-key: ${SUPPLIER_B_API_KEY:local-dev-key-b}
      chunk-size: 50
      connect-timeout: 1s
      call-timeout: 3s
      paths:
        catalog: /b/api/properties
        availability: /b/api/search

logging:
  level:
    io.github.jys0615.stayport: INFO
